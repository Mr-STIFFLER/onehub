name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: onehub
          POSTGRES_PASSWORD: onehub
          POSTGRES_DB: onehub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U onehub" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
        env:
          DATABASE_URL: postgres://onehub:onehub@localhost:5432/onehub
      - run: pnpm --filter @onehub/client build

  windows-installer:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: desktop/src-tauri }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir desktop build
      - uses: actions/upload-artifact@v4
        with:
          name: onehub-windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
